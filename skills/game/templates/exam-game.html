<script>
"use strict";
/* ---------- content ---------- */
let DATA,LOADERR=null;

/* ---------- math ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Plain-text math to HTML. x^2, a/b, n_0, n_{t+1}, (a+b)/c, sqrt and ln. Incomplete input never throws. */
function mathHTML(src){
  const s=greek(src).replace(/\s+/g,'');let i=0;const peek=()=>s[i];
  function group(open,close){let d=1,j=i+1;while(j<s.length&&d){if(s[j]===open)d++;if(s[j]===close)d--;j++}const inner=s.slice(i+1,d?j:j-1);i=j;return inner}
  function atom(){const c=peek();if(c===undefined)return'';
    if(c==='('){i++;const e=expr();if(peek()===')')i++;return{g:e}}
    const m=/^(ln|log|exp|sqrt|[dΔ][A-Zxt](?!_)|\d*\.?\d+|[A-Za-zλΣΔθαβγμπωρτεφ])/.exec(s.slice(i));
    if(!m){i++;return esc(c)}
    i+=m[0].length;let t=m[0];
    if(['ln','log','exp','sqrt'].includes(t))return'<span class="rm">'+t+'</span>';
    if(/^[\d.]/.test(t))return'<span class="rm">'+t+'</span>';
    t=/[ΣΔλ]/.test(t)?'<span class="rm">'+t+'</span>':esc(t);
    if(peek()==='_'){i++;if(peek()==='{'){t+='<sub>'+esc(group('{','}'))+'</sub>'}else{const b=/^(max|min|\w)/.exec(s.slice(i));if(b){i+=b[0].length;t+='<sub>'+esc(b[0])+'</sub>'}}}
    return t}
  const show=a=>a&&a.g!==undefined?'('+a.g+')':a;
  function pow(){let a=atom();while(peek()==='^'){i++;let b;if(peek()==='-'){i++;b='−'+show(atom())}else if(peek()==='{'){b=mathHTML(group('{','}')).replace(/^<span class="m">|<\/span>$/g,'')}else{const x=atom();b=x&&x.g!==undefined?x.g:x}a=show(a)+'<sup>'+b+'</sup>'}return a}
  function term(){let out='';while(i<s.length&&!'+-=)'.includes(peek())){if(peek()==='*'){i++;out+=' · ';continue}if(peek()==='/'){i++;let d=pow();d=d&&d.g!==undefined?d.g:d;out='<span class="frac"><span>'+out+'</span><span>'+d+'</span></span>';continue}const b=i;out+=show(pow());if(i===b)i++}return out}

}
/* Prose with $math$ in it. Text outside math is escaped. */
const rich=s=>String(s==null?'':s).replace(/\\\$/g,'\u0001').split(/(\$[^$]+\$)/).map(p=>/^\$[^$]+\$$/.test(p)?mathHTML(p.slice(1,-1)):esc(p)).join('').replace(/\u0001/g,'$');
/* ---------- checking typed answers ---------- */
function normF(s,cs){let t=greek(s).replace(/_\{([^}]*)\}/g,'$1').replace(/[\s_*]/g,'').replace(/\{/g,'(').replace(/\}/g,')');return cs?t:t.toLowerCase()}

function symbols(canon,cs){const out=[],re=/(?:Δ[A-Za-zλθαβγμπωρτεφ]|(?<![A-Za-z])d[A-Zxt](?![a-z])|[A-Za-zλΣΔθαβγμπωρτεφ])(?:_\{[^}]*\}|_\w+)?/g;let m;const t=greek(canon).replace(/\b(ln|log|exp|sqrt)\b/g,' ');while((m=re.exec(t))){const k=normF(m[0],cs);if(k!=='e'&&!out.includes(k))out.push(k)}return out.sort((a,b)=>b.length-a.length)}

/* One typo is forgiven only in a long word with the same first letter. Add close wrong answers to near: afferent for efferent. */
function checkTerm(input,answers,near){const n=normT(input);if(!n)return false;if((near||[]).some(w=>normT(w)===n))return false;return answers.some(a=>{const t=normT(a);return n===t||(t.length>=8&&n[0]===t[0]&&lev(n,t)<=1)})}
/* Safe arithmetic: + - * / ^ ( ) e pi ln log exp sqrt. Learners may type a setup. */
function evalExpr(src,vars){
  const s=greek(src).replace(/,/g,'').replace(/\s+/g,'').replace(/(\d)[xX]10\^/g,'$1*10^').replace(/%$/,'/100');let i=0;
  function fn(n,f){if(s.startsWith(n,i)&&!/[a-z]/i.test(s[i+n.length]||'')){i+=n.length;return f(atom())}return null}
  function atom(){
    if(s[i]==='-'){i++;return -pow()}
    for(const[n,f]of[['ln',Math.log],['log',Math.log10],['sqrt',Math.sqrt],['exp',Math.exp]]){const v=fn(n,f);if(v!==null)return v}
    if(s[i]==='('){i++;const v=sum();if(s[i]!==')')throw 0;i++;return v}
    const id=/^[A-Za-z_][A-Za-z0-9_]*/.exec(s.slice(i));
    if(id&&vars&&id[0] in vars){i+=id[0].length;return vars[id[0]]}
    if(s[i]==='e'){i++;return Math.E}

    const m=/^\d*\.?\d+(e[-+]?\d+)?/i.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return parseFloat(m[0])}

  if(!s)return null;try{const v=sum();return i===s.length&&isFinite(v)?v:null}catch(e){return null}
}
const closeTo=(v,a,tol)=>v!==null&&Math.abs(v-a)<=Math.max(Math.abs(a)*.015,tol||0);
function fmt(v){const a=Math.abs(v);if(a&&a<1)return String(+v.toPrecision(3));return(+v.toFixed(a>=100?0:a>=10?1:2)).toLocaleString('en-US',{maximumFractionDigits:3})}
/* A typed number: a setup, scientific notation, or a value with its unit or currency sign. */
function readNum(src){const t=String(src).trim().replace(/^\$/,'');let v=evalExpr(t);if(v!==null)return{v,pct:/%$/.test(t)};const m=/^(.*?\d\)?)\s*[A-Za-zµΩ°/⁻¹²³ ]+$/.exec(t);if(m){v=evalExpr(m[1]);if(v!==null)return{v}}return null}
const pick=a=>a[Math.floor(Math.random()*a.length)];
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
/* ---------- items ---------- */
const FORMULAS=DATA.formulas||[],TOPICS=DATA.topics||[],GATE=FORMULAS.filter(f=>f.tier==='memorize');
const ITEM={};

/* ---------- exams: no feedback until the end ---------- */
function exam(cfg){view='exam';E=Object.assign({i:0,ans:[]},cfg);examCard()}
function examCard(){const c=E.cards[E.i],[k,cl]=CHIP[c.type]||['',''];
  app.innerHTML=`<div class="row" style="justify-content:space-between"><span class="label">${esc(E.name)}</span><span class="label">${E.i+1} of ${E.cards.length}</span></div><div class="bar thin"><i style="width:${E.i/E.cards.length*100}%"></i></div><section class="panel"><span class="chip ${cl}" style="align-self:flex-start">${k}</span>${ask(c)}</section>${input(c)}`;
  const rec=v=>{if(c.type==='num'&&!readNum(v))return unread();E.ans.push({c,v,g:grade(c,v)});E.i++;if(E.i<E.cards.length)examCard();else E.done()};
  if(c.type==='sort')$('opts').onclick=e=>{const b=e.target.closest('.opt');if(b)rec(+b.dataset.i)};
  else{const inp=wire(c);inp.focus();const go=()=>{if(inp.value.trim())rec(inp.value)};$('sub').onclick=go;inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go()}}}}
const reviewHTML=l=>`<div class="review">${l.map(a=>`<div class="it ${a.g.ok?'ok':''}"><b>${a.g.ok?'Right.':'Not yet.'}</b> ${a.c.type==='formula'?esc(a.c.f.name):rich(a.c.q)}${a.g.ok?'':`<br>${answerText(a.c)}${a.c.why?' · '+rich(a.c.why):''}`}</div>`).join('')}</div>`;
function result(h,body,label,fn){view='result';app.innerHTML=`<section class="panel"><h2>${h}</h2>${body}<div class="row"><button class="btn big" id="go">${label}</button></div></section>`;$('go').onclick=fn;$('go').focus()}
function gateExam(){const a=shuffle(GATE).map(f=>build(ITEM['f:'+f.id])),b=shuffle(GATE.filter(f=>f.apply)).map(f=>build(ITEM[f.apply.id])),n=a.length+b.length;
  exam({name:'Gate test: must be perfect',cards:a.concat(b),done(){const m=E.ans.filter(x=>!x.g.ok);
    if(!m.length){P.gate=Date.now();P.recheck=0;save();result(`${n} of ${n} from a blank page`,`<p>The rest is open. A delayed recheck appears after ${CFG.recheckHours} hours. Passing today is same-session evidence; the recheck is the one that shows what held.</p>`,'Open the map',home)}
    else{m.forEach(x=>{delete P.c[x.c.id];if(x.c.formula)delete P.c['f:'+x.c.formula]});save();result(`${n-m.length} of ${n}. It takes ${n}.`,reviewHTML(m),'Drill those, then retest',()=>start(GATE_STAGE))}}})}
function recheck(){const cards=GATE.length?shuffle(GATE).map(f=>ITEM['f:'+f.id]):shuffle(allItems().filter(i=>cleared(i)&&i.type!=='sort')).slice(0,8);
  exam({name:'Delayed recheck',cards:cards.map(build),done(){const m=E.ans.filter(x=>!x.g.ok),n=E.cards.length;P.tried=Date.now();P.lastCheck=(n-m.length)+' of '+n+' held';if(!m.length)P.recheck=Date.now();m.forEach(x=>delete P.c[x.c.id]);save();const again=GATE.length?GATE_STAGE:TOPICS.find(t=>m.some(x=>t.items.some(i=>i.id===x.c.id)));result(`${n-m.length} of ${n} held`,m.length?reviewHTML(m)+`<p>Another recheck opens ${CFG.recheckHours} hours from now.</p>`:'<p>Retrieved after a delay, unaided.</p>',m.length?'Drill the misses':'Open the map',m.length?()=>start(again):home)}})}
function mock(){const all=TOPICS.flatMap(t=>t.items),x=DATA.exam||{},q=shuffle(all.filter(i=>i.type==='sort'||i.type==='term')).slice(0,x.quick??12),m=(x.math||[]).map(id=>ITEM[id]).filter(Boolean),f=shuffle(all.filter(i=>i.type==='free')).slice(0,x.free??3);
  exam({name:'Mock exam',cards:q.concat(m,f).map(build),done(){const auto=E.ans.filter(a=>a.c.type!=='free'),ok=auto.filter(a=>a.g.ok).length,p=auto.length?Math.round(ok/auto.length*100):0,fr=E.ans.filter(a=>a.c.type==='free');P.mock=Math.max(P.mock||0,p);auto.filter(a=>!a.g.ok).forEach(a=>delete P.c[a.c.id]);save();const m=auto.filter(a=>!a.g.ok);
    result(`${p}% on ${auto.length} auto-marked items`,`<p>${CFG.mockTarget!==null&&p>=CFG.mockTarget?'That hits the target you set. Rest helps more than another run now.':m.length?'Your misses went back into their stages. Clear them, then run it again.':''} This is a practice score, not a prediction.</p>${m.length?reviewHTML(m):''}${fr.length?`<div class="label">Short answers: compare these yourself</div><div class="review">${fr.map(a=>`<div class="it ok"><b>${rich(a.c.q)}</b><br>You wrote: ${esc(a.v)}<br>Model: ${rich(a.c.model)}</div>`).join('')}</div>`:''}`,'Back to map',home)}})}
document.addEventListener('keydown',e=>{if((view==='play'||view==='exam')&&/^[1-6]$/.test(e.key)&&$('opts')&&!e.target.matches('input,textarea')){const b=document.querySelector(`.opt[data-i="${+e.key-1}"]`);if(b)b.click()}});
/* ---------- audit: run this before delivering ---------- */
function gameAudit(){const r={fatal:LOADERR,duplicateIds:[],noSource:[],noUnits:[],formulaAltsMissRhs:[],cannotType:[],applyIgnored:[],modelFailsRubric:[],badSort:[],badNumber:[],badPattern:[],rawTeX:[],suspectMath:[],sortOnly:[],objectives:{},counts:{}};
  const seen={},note=id=>{if(seen[id])r.duplicateIds.push(id);seen[id]=1},typable=/^[\x00-\x7FλΣΔθαβγμπωρτεφ]*$/;
  const add=(obj,kind,id)=>{if(obj){const o=r.objectives[obj]=r.objectives[obj]||{production:[],sort:[]};o[kind].push(id)}};
  const walk=(v,path)=>{if(typeof v==='string'){if(path.endsWith('.svg')||path.includes('.pattern'))return;if(/\\(frac|text|sum|times|cdot|alpha|beta|lambda|sqrt|mathrm)\b|\^\{\}/.test(v))r.rawTeX.push(path);(v.match(/\$[^$]+\$/g)||[]).forEach(m=>{if(/[a-z]{3,}[ ,]+[a-z]{3,}/i.test(m)&&!/\b(ln|log|exp|sqrt)\b/.test(m))r.suspectMath.push(path)})}else if(Array.isArray(v))v.forEach((x,i)=>walk(x,path+'['+i+']'));else if(v&&typeof v==='object')for(const k in v)if(!['f','topic'].includes(k))walk(v[k],path+'.'+k)};walk(DATA,'game');
  FORMULAS.forEach(f=>{note('formula:'+f.id);if(!f.src)r.noSource.push(f.id);if(!f.units)r.noUnits.push(f.id);if(!(f.alts||[]).some(a=>checkFormula(f.rhs,[a],f.caseSensitive)))r.formulaAltsMissRhs.push(f.id);if(!typable.test(greek(f.rhs))&&!(f.alts||[]).some(a=>typable.test(greek(a))))r.cannotType.push(f.id);if(f.apply&&f.tier!=='memorize')r.applyIgnored.push(f.id);add(f.obj,'production','f:'+f.id)});
  allItems().forEach(it=>{if(it.type==='formula')return;note(it.id);if(!it.src)r.noSource.push(it.id);add(it.obj,it.type==='sort'?'sort':'production',it.id);r.counts[it.type]=(r.counts[it.type]||0)+1;
    if(it.type==='sort'&&(!it.options||!(it.answer>=0&&it.answer<it.options.length)))r.badSort.push(it.id);
    if(it.type==='free'){try{if(!grade(it,String(it.model).replace(/\$/g,'')).ok)r.modelFailsRubric.push(it.id)}catch(e){r.badPattern.push(it.id)}}
    if(it.type==='num'){const n=it.vars?20:1,strip=t=>String(t).replace(/\$[^$]*\$/g,'');for(let i=0;i<n;i++){const c=build(it);if(typeof c.answer!=='number'||!isFinite(c.answer)||/\{=|\{\w+\}|NaN|undefined/.test(strip(c.q)+strip(c.why))||!closeTo(parseFloat(fmt(c.answer).replace(/,/g,'')),c.answer,c.tol)){r.badNumber.push(it.id);break}}}});
  r.sortOnly=Object.keys(r.objectives).filter(k=>!r.objectives[k].production.length);
  (DATA.exam&&DATA.exam.math||[]).forEach(id=>{if(!ITEM[id])r.badNumber.push('exam.math:'+id)});
  r.ok=!r.fatal&&!['duplicateIds','noSource','noUnits','formulaAltsMissRhs','cannotType','applyIgnored','modelFailsRubric','badSort','badNumber','badPattern','rawTeX','suspectMath','sortOnly'].some(k=>r[k].length);return r}
const auditContent=gameAudit;window.gameAudit=()=>Object.assign(auditContent(),{progressSaves:saved});
window.__game={get card(){return view==='exam'&&E?E.cards[E.i]:R&&R.cur},get view(){return view},get progress(){return P},mathHTML,evalExpr,checkFormula,checkTerm,readNum,fmt};
home();
</script>

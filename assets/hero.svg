<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">Myelinate. Understand it. Retrieve it. Use it.</title>
  <desc id="desc">Notebook-paper banner. The Myelinate wordmark and tagline sit above a drawn nerve fiber whose insulated segments are joined by arcs labeled teach, tutor, lab, print, flashcards, memory hooks, study plan, find media and verify.</desc>
  <defs>
    <pattern id="rules" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 39.5H40" stroke="#cbd4cc" stroke-width="1" opacity=".5"/></pattern>
    <clipPath id="canvas"><rect width="1280" height="480"/></clipPath>
  </defs>
  <g clip-path="url(#canvas)">
    <rect width="1280" height="480" fill="#f7f3e9"/>
    <rect width="1280" height="480" fill="url(#rules)"/>
    <path d="M80 0V480" stroke="#d6a78f" stroke-width="2" opacity=".7"/>

    <g font-family="Inter, 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3.2">
      <text x="124" y="84" fill="#a54320">AN OPEN-SOURCE SKILL SUITE FOR LEARNING</text>
    </g>
    <g transform="translate(1148 46) scale(0.8125)" aria-hidden="true">
      <path d="M0 41H64" stroke="#16313b" stroke-width="3"/>
      <path d="M0 35a6 6 0 0 1 0 12z" fill="#16313b"/>
      <rect x="10.5" y="35" width="19" height="12" rx="6" fill="#16313b"/>
      <rect x="34.5" y="35" width="19" height="12" rx="6" fill="#16313b"/>
      <path d="M64 35a6 6 0 0 0 0 12z" fill="#16313b"/>
      <path d="M8 31V23a12 12 0 0 1 24 0v8M32 23a12 12 0 0 1 24 0v8" fill="none" stroke="#a54320" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g aria-hidden="false">
      <path d="M898 144V292" stroke="#a54320" stroke-width="2" opacity=".55"/>
      <text x="920" y="164" font-family="Inter, 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="2" fill="#4c6269">EVERY SESSION</text>
      <g font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="21" font-style="italic" fill="#16313b">
        <text x="920" y="202"><tspan fill="#a54320" font-style="normal" font-weight="600">1 </tspan> Predict before you see.</text>
        <text x="920" y="238"><tspan fill="#a54320" font-style="normal" font-weight="600">2 </tspan> Retrieve; don’t reread.</text>
        <text x="920" y="274"><tspan fill="#a54320" font-style="normal" font-weight="600">3 </tspan> Revisit before it fades.</text>
      </g>
    </g>
    <text x="118" y="206" fill="#16313b" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="108" font-weight="500" letter-spacing="-2">Myelinate<tspan fill="#a54320">.</tspan></text>
    <text x="124" y="258" fill="#16313b" font-family="Inter, 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="600">Understand it. Retrieve it. Use it.</text>
    <text font-family="Inter, 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#4c6269">
      <tspan x="124" y="300">Courses, live tutoring, labs, printable tests, flashcards and study plans.</tspan>
      <tspan x="124" y="327">Honest, not agreeable. High-stakes material gets an adversarial review.</tspan>
    </text>

    <g aria-hidden="true">
      <path d="M80 404H1280" stroke="#16313b" stroke-width="3"/>
      <rect x="80" y="395" width="58" height="18" rx="9" fill="#16313b"/><rect x="154" y="395" width="116" height="18" rx="9" fill="#16313b"/><rect x="286" y="395" width="116" height="18" rx="9" fill="#16313b"/><rect x="418" y="395" width="115" height="18" rx="9" fill="#16313b"/><rect x="549" y="395" width="116" height="18" rx="9" fill="#16313b"/><rect x="681" y="395" width="116" height="18" rx="9" fill="#16313b"/><rect x="813" y="395" width="115" height="18" rx="9" fill="#16313b"/><rect x="944" y="395" width="116" height="18" rx="9" fill="#16313b"/><rect x="1076" y="395" width="116" height="18" rx="9" fill="#16313b"/><rect x="1208" y="395" width="104" height="18" rx="9" fill="#16313b"/>
      <path d="M146 389C146 342 278 342 278 389 M278 389C278 342 410 342 410 389 M410 389C410 342 541 342 541 389 M541 389C541 342 673 342 673 389 M673 389C673 342 805 342 805 389 M805 389C805 342 936 342 936 389 M936 389C936 342 1068 342 1068 389 M1068 389C1068 342 1200 342 1200 389" fill="none" stroke="#a54320" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="146" cy="404" r="4" fill="#a54320"/><circle cx="278" cy="404" r="4" fill="#a54320"/><circle cx="410" cy="404" r="4" fill="#a54320"/><circle cx="541" cy="404" r="4" fill="#a54320"/><circle cx="673" cy="404" r="4" fill="#a54320"/><circle cx="805" cy="404" r="4" fill="#a54320"/><circle cx="936" cy="404" r="4" fill="#a54320"/><circle cx="1068" cy="404" r="4" fill="#a54320"/><circle cx="1200" cy="404" r="4" fill="#a54320"/>
      <g font-family="Inter, 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.3" fill="#4c6269"><text x="146" y="442" text-anchor="middle">TEACH</text><text x="278" y="442" text-anchor="middle">TUTOR</text><text x="410" y="442" text-anchor="middle">LAB</text><text x="541" y="442" text-anchor="middle">PRINT</text><text x="673" y="442" text-anchor="middle">FLASHCARDS</text><text x="805" y="442" text-anchor="middle">MEMORY HOOKS</text><text x="936" y="442" text-anchor="middle">STUDY PLAN</text><text x="1068" y="442" text-anchor="middle">FIND MEDIA</text><text x="1200" y="442" text-anchor="middle">VERIFY</text></g>
    </g>
  </g>
</svg>

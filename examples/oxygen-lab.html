<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- CONTENT: page title and description -->
<title>Oxygen Unloading Lab</title>
<meta name="description" content="A Myelinate interactive lab on the oxygen–hemoglobin dissociation curve and the Bohr effect: predict, explore a Hill-equation model, explain, practice, and review.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,560;9..144,650&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===== Brand tokens (swap here) ===== */
:root{
  --paper:#f7f3e9; --paper-2:#efe8d8; --card:#fbf8f1; --ink:#16313b; --ink-2:#3f5661; --ink-3:#5a6b72;
  --rule:#d8cfbc; --rule-strong:#b9ad95;
  --accent:#a54320; --accent-soft:#f3e0d4; --on-accent:#fffaf2;
  --ref:#55686f; --pred:#16313b;
  --good:#2b6942; --good-soft:#deecdf; --warn:#865100; --warn-soft:#f6e7c9; --bad:#9a2c1e; --bad-soft:#f6dcd5;
  --focus:#1d6e8a; --shadow:0 1px 0 rgba(22,49,59,.06);
  --serif:"Fraunces", Georgia, "Times New Roman", serif;
  --sans:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10191c; --paper-2:#172328; --card:#142025; --ink:#ede6d7; --ink-2:#bcc6c4; --ink-3:#8d9b9d;
    --rule:#2b3b41; --rule-strong:#44585f;
    --accent:#e8875f; --accent-soft:#3b231a; --on-accent:#1a0e09;
    --ref:#93a7ad; --pred:#ede6d7;
    --good:#86d29f; --good-soft:#173123; --warn:#e9b65e; --warn-soft:#352812; --bad:#f39383; --bad-soft:#3b1c17;
    --focus:#7fcbe4; --shadow:none; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10191c; --paper-2:#172328; --card:#142025; --ink:#ede6d7; --ink-2:#bcc6c4; --ink-3:#8d9b9d;
  --rule:#2b3b41; --rule-strong:#44585f;
  --accent:#e8875f; --accent-soft:#3b231a; --on-accent:#1a0e09;
  --ref:#93a7ad; --pred:#ede6d7;
  --good:#86d29f; --good-soft:#173123; --warn:#e9b65e; --warn-soft:#352812; --bad:#f39383; --bad-soft:#3b1c17;
  --focus:#7fcbe4; --shadow:none; color-scheme: dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.55 var(--sans);overflow-x:hidden}
h1,h2,h3{font-family:var(--serif);font-weight:560;line-height:1.15;letter-spacing:-.01em;margin:0}
h2{font-size:clamp(1.6rem,1.2rem + 1.6vw,2.25rem)}
h3{font-size:1.2rem;font-weight:600}
p{margin:.6em 0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font:600 .78rem/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 .5rem}
.muted{color:var(--ink-2)}
.small{font-size:.92rem}

/* ===== Shell ===== */
.top{border-bottom:1px solid var(--rule);background:var(--paper)}
.top-in{max-width:1360px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font:600 .95rem var(--sans);letter-spacing:.02em}
.brand-mark{width:28px;height:28px;flex:none}
.top-title{font-family:var(--serif);font-size:1.15rem;font-weight:560;margin-left:4px}
.top-sp{flex:1}
.layout{max-width:1360px;margin:0 auto;padding:24px 20px 80px;display:grid;grid-template-columns:232px minmax(0,1fr);gap:40px}
.notice{max-width:1360px;margin:12px auto 0;padding:0 20px}
.notice-in{border:1px solid var(--rule);background:var(--card);border-radius:var(--r);padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.notice-in p{margin:0;flex:1;min-width:200px}

/* Rail */
.rail{position:sticky;top:20px;align-self:start}
.rail .rail-toggle{display:none}
.rail-meter{display:flex;gap:3px;margin:0 0 14px}
.rail-meter span{flex:1;height:5px;border-radius:3px;background:var(--rule)}
.rail-meter span.done{background:var(--ink)}
.rail-meter span.cur{background:var(--accent)}
.rail ol{list-style:none;margin:0;padding:0;border-left:1px solid var(--rule)}
.rail li{margin:0}
.rail button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:6px 10px 6px 14px;margin-left:-1px;border:0;border-left:3px solid transparent;background:none;text-align:left;cursor:pointer;color:var(--ink-2);font-size:.95rem;border-radius:0 6px 6px 0}
.rail button:hover:not([aria-disabled="true"]){background:var(--paper-2)}
.rail button[aria-current="step"]{border-left-color:var(--accent);color:var(--ink);font-weight:600;background:var(--paper-2)}
.rail button[aria-disabled="true"]{cursor:not-allowed;color:var(--ink-3)}
.rail .num{font:500 .78rem var(--mono);width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--rule-strong);flex:none}
.rail .done .num{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.rail-foot{margin-top:18px;font-size:.88rem;color:var(--ink-2)}

/* Main step */
main{min-width:0}
.step-head{margin-bottom:22px;max-width:760px}
.step-head .lede{font-size:1.1rem;color:var(--ink-2);margin-top:.6rem}
.prose{max-width:720px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
.stack > * + *{margin-top:16px}
.callout{border-left:3px solid var(--accent);padding:6px 0 6px 16px;margin:16px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.12)}
.btn.secondary{background:transparent;color:var(--ink);border-color:var(--rule-strong)}
.btn.secondary:hover{background:var(--paper-2);filter:none}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2);padding:8px 10px}
.btn.ghost:hover{color:var(--ink);background:var(--paper-2);filter:none}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed;filter:none}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:32px;padding-top:18px;border-top:1px solid var(--rule)}
.gate-msg{color:var(--ink-2);font-size:.95rem;flex:1 1 220px;text-align:right;margin:0}
.gate-msg.alert{color:var(--accent);font-weight:600}
textarea,input[type=text]{width:100%;border:1px solid var(--rule-strong);background:var(--paper);border-radius:8px;padding:10px 12px;min-height:44px}
textarea{min-height:96px;resize:vertical;line-height:1.45}
input[type=text].num-in{width:7.5em;font-family:var(--mono)}
label.lbl{display:block;font-weight:600;margin:0 0 6px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-weight:600;padding:0;margin-bottom:8px}

/* Choice rows (radio/checkbox) */
.choices{display:grid;gap:8px}
.choice{display:flex;gap:12px;align-items:flex-start;min-height:44px;padding:10px 14px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);cursor:pointer;line-height:1.4}
.choice:hover{border-color:var(--rule-strong)}
.choice input{margin:3px 0 0;width:18px;height:18px;flex:none;accent-color:var(--accent)}
.choice:has(input:checked){border-color:var(--ink);background:var(--paper-2)}
.choice:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.choice.is-correct,.choice.is-correct:has(input:checked){border-color:var(--good);background:var(--good-soft)}
.choice.is-wrong,.choice.is-wrong:has(input:checked){border-color:var(--bad);background:var(--bad-soft)}
.choice .yours{margin-left:auto;padding-left:10px;font:600 .74rem var(--sans);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;color:var(--ink-2)}
.choice.is-correct .yours{color:var(--good)}.choice.is-wrong .yours{color:var(--bad)}
.choice .key{font:600 .85rem var(--mono);color:var(--ink-2);width:1.2em;flex:none;margin-top:1px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border:1px solid var(--rule-strong);border-radius:999px;cursor:pointer;background:var(--paper)}
.pill input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.pill:has(input:checked){background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pill:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.pill:has(input:disabled){opacity:.7;cursor:default}

/* Feedback */
.fb{border-radius:8px;padding:12px 14px;margin-top:12px;border:1px solid}
.fb.good{background:var(--good-soft);border-color:var(--good)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb.warn{background:var(--warn-soft);border-color:var(--warn)}
.fb.info{background:var(--paper-2);border-color:var(--rule-strong)}
.fb strong.tag{display:block;margin-bottom:2px}
.fb.good strong.tag{color:var(--good)} .fb.bad strong.tag{color:var(--bad)} .fb.warn strong.tag{color:var(--warn)}
.reteach{margin-top:12px;border:1px dashed var(--accent);border-radius:8px;padding:14px 16px;background:var(--accent-soft)}
.reteach h4{margin:0 0 4px;font-family:var(--serif);font-weight:600;font-size:1.05rem}
.mis{font:600 .8rem var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--bad)}

/* Hints */
.hints{margin-top:14px}
.hint{border-left:3px solid var(--rule-strong);padding:6px 0 6px 14px;margin-top:10px}
.hint b{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}

/* Charts */
.chart{width:100%;height:auto;display:block;touch-action:none}
.chart text{font-family:var(--sans);fill:var(--ink)}
.chart .tick{font:14px var(--mono);fill:var(--ink-2)}
.chart .axis{stroke:var(--ink);stroke-width:1.2}
.chart .grid{stroke:var(--rule);stroke-width:1}
.chart .axis-title{font:600 15px var(--sans);fill:var(--ink-2)}
.chart .c-tissue{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.chart .c-ref{fill:none;stroke:var(--ref);stroke-width:2;stroke-dasharray:6 5}
.chart .lab{font:600 15px var(--sans)}
.chart .lab-acc{fill:var(--accent)}
.chart .lab-ref{fill:var(--ref)}
.chart .lab-sm{font:14px var(--sans);fill:var(--ink-2)}
.chart .halo{paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.chart .guide{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 4}
.chart .pt-art{fill:var(--card);stroke:var(--ref);stroke-width:2.5}
.chart .pt-t{fill:var(--accent);stroke:var(--card);stroke-width:2}
.chart .pt-pred{fill:var(--card);stroke:var(--pred);stroke-width:2.5}
.chart .hl{stroke:var(--accent);stroke-width:3}
.chart .handle{cursor:ns-resize}
.chart-fig{margin:0}
.chart-cap{font-size:.9rem;color:var(--ink-2);margin-top:6px}

/* Sim layout */
.sim{display:grid;gap:18px;grid-template-columns:272px minmax(0,1fr) 260px;grid-template-areas:"ctrl guide guide" "ctrl chart chart" "ctrl read inst";align-items:start}
.sim > .a-guide .guide-q{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 18px;margin:0}
.sim > .a-guide .guide-q li{margin:0}
.sim > .a-ctrl{grid-area:ctrl}.sim > .a-chart{grid-area:chart}.sim > .a-guide{grid-area:guide}.sim > .a-read{grid-area:read}.sim > .a-inst{grid-area:inst}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:16px}
.panel h3{font-family:var(--sans);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:700;margin:0 0 10px}
.ctl{margin-bottom:16px}
.ctl-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ctl-top label,.ctl-top .lbl2{font-weight:600}
.ctl-val{font:500 .95rem var(--mono)}
.ctl-note{font-size:.84rem;color:var(--ink-2);margin:2px 0 0;min-height:1.2em}
input[type=range]{width:100%;height:44px;margin:0;background:transparent;accent-color:var(--accent);cursor:pointer}
.range-ends{display:flex;justify-content:space-between;font:12px var(--mono);color:var(--ink-2);margin-top:-8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.seg label{display:flex;align-items:center;justify-content:center;min-height:44px;border:1px solid var(--rule-strong);border-radius:8px;font-size:.9rem;cursor:pointer;text-align:center;padding:4px;line-height:1.15}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg label:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.seg label:has(input:disabled){opacity:.55;cursor:not-allowed}
.switch{display:flex;align-items:flex-start;gap:10px;min-height:44px;padding:8px 0;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--accent);margin:2px 0 0;flex:none}
.switch span small{display:block;color:var(--ink-2);font-size:.84rem}
.read-table{width:100%;border-collapse:collapse;font-size:.95rem}
.read-table th,.read-table td{padding:6px 4px;border-bottom:1px solid var(--rule);text-align:left}
.read-table td.n,.read-table th.n{text-align:right;font-family:var(--mono)}
.bar-row{margin-top:12px}
.bar-lab{display:flex;justify-content:space-between;font-size:.92rem;gap:8px}
.bar-track{position:relative;height:16px;background:var(--paper-2);border-radius:4px;margin-top:4px;border:1px solid var(--rule)}
.bar-fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px 0 0 3px}
.bar-ref{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.bar-key{font-size:.82rem;color:var(--ink-2);margin-top:8px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:.95rem;padding:3px 0}
.inst-pick{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;margin-bottom:8px}
.guide-q{margin:0 0 10px;padding-left:0;list-style:none;counter-reset:q}
.guide-q li{counter-increment:q;padding-left:28px;position:relative;margin-bottom:10px;font-size:.95rem}
.guide-q li::before{content:counter(q);position:absolute;left:0;top:1px;width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:600 .75rem var(--mono);display:grid;place-items:center}
details.notes{border:1px solid var(--rule);border-radius:var(--r);background:var(--card);margin-top:18px}
details.notes > summary{cursor:pointer;padding:12px 16px;min-height:44px;font-weight:600;list-style-position:inside}
details.notes .notes-in{padding:0 18px 16px;font-size:.95rem}
details.notes li{margin-bottom:6px}

/* Parts */
.parts{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.term{display:block;width:100%;text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:10px 14px;min-height:44px;cursor:pointer;margin-bottom:8px}
.term[aria-expanded="true"]{border-color:var(--ink);background:var(--card)}
.term .t-name{font-weight:700}
.term .t-def{display:block;margin-top:4px;color:var(--ink-2);font-size:.95rem}
.term .seen{float:right;font-size:.8rem;color:var(--good);font-weight:600}

/* Predict */
.pred-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:start}
.pred-grid > .card,.parts > .card{margin-top:0}

/* Worked */
.we{counter-reset:s}
.we ol{padding-left:1.3em;margin:.4em 0}
.we li{margin-bottom:.35em}
.we .mono{font-size:.9em}
.we .blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--accent);text-align:center;font-family:var(--mono)}
.badge{display:inline-block;white-space:nowrap;font:600 .74rem var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--rule-strong);color:var(--ink-2);vertical-align:middle}
.badge.b-good{border-color:var(--good);color:var(--good)} .badge.b-warn{border-color:var(--warn);color:var(--warn)} .badge.b-bad{border-color:var(--bad);color:var(--bad)} .badge.b-acc{border-color:var(--accent);color:var(--accent)}
.q-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-size:.88rem;color:var(--ink-2)}
.sub-q{margin-top:14px}

/* Formalize */
.rule-big{font-family:var(--serif);font-size:clamp(1.25rem,1rem + 1vw,1.6rem);line-height:1.3;margin:0}
.cadet{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:14px 0}
.cadet div{border:1px solid var(--rule);border-radius:8px;padding:10px 8px;text-align:center;background:var(--paper)}
.cadet b{display:block;font-family:var(--serif);font-size:1.8rem;color:var(--accent);line-height:1}
.cadet span{font-size:.86rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* Results */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{border:1px solid var(--rule);border-radius:var(--r);padding:14px;background:var(--card)}
.stat b{display:block;font:500 1.8rem var(--mono);line-height:1.1}
.stat span{font-size:.9rem;color:var(--ink-2)}
.tbl-wrap{overflow-x:auto}
table.res{width:100%;border-collapse:collapse;font-size:.95rem}
table.res th,table.res td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--rule);vertical-align:top}
table.res th{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.fc{border:1px solid var(--rule-strong);border-radius:12px;background:var(--card);padding:22px;min-height:170px;display:flex;flex-direction:column;justify-content:center}
.fc .side{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.fc .face{font-family:var(--serif);font-size:1.25rem;line-height:1.35;margin-top:6px}
.fc .back{margin-top:12px;padding-top:12px;border-top:1px solid var(--rule)}

dialog{border:1px solid var(--rule-strong);border-radius:12px;background:var(--card);color:var(--ink);padding:22px;max-width:min(440px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,20,24,.45)}

@media (prefers-reduced-motion: no-preference){
  .btn,.choice,.pill,.term,.rail button{transition:background-color .15s ease,border-color .15s ease,color .15s ease}
  html{scroll-behavior:smooth}
}
@media (max-width:1180px){
  .sim{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"guide guide" "chart chart" "ctrl read" "ctrl inst"}
  .sim > .a-guide .guide-q{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr);gap:16px;padding-top:12px}
  .rail{position:static}
  .rail .rail-toggle{display:flex;width:100%;justify-content:space-between;border:1px solid var(--rule-strong);border-radius:8px;margin-left:0;padding:8px 14px;color:var(--ink);font-weight:600;background:var(--card)}
  .rail .rail-toggle::after{content:'Show steps ▾';font-weight:400;color:var(--ink-2);font-size:.9rem}
  .rail.open .rail-toggle::after{content:'Hide ▴'}
  .rail ol{display:none;margin-top:8px}
  .rail.open ol{display:block}
  .rail-foot{display:none}
  .parts,.pred-grid,.two{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  body{font-size:16px}
  .top-in,.layout,.notice{padding-left:16px;padding-right:16px}
  .top-title{display:none}
  .card{padding:16px}
  .sim{grid-template-columns:minmax(0,1fr);grid-template-areas:"guide" "chart" "ctrl" "read" "inst"}

<script>
/* =====================================================================
   STATE MACHINE (designed before the UI; every state below is reachable)
   ---------------------------------------------------------------------
   Global
     BOOT --(storage ok)--> LOAD_SAVED --> STEP[saved.step]
     BOOT --(storage throws)--> MEMORY_ONLY (notice shown) --> STEP[0]
     STEP[i] --next (only if done(i))--> STEP[i+1]; maxReached = max(maxReached, i+1)
     STEP[i] --back--> STEP[i-1]            (always allowed)
     STEP[i] --rail(j), j <= maxReached--> STEP[j]
     ANY --Clear progress--> CONFIRMING --cancel--> previous
                                         --erase--> fresh state, STEP[0]
   Per step (done(i) in brackets)
     0 hook:      EMPTY --save guess | "no guess yet"--> ANSWERED [done]
     1 parts:     VIEWING(k of 4 terms opened) --open all 4--> ALL_SEEN [done]
     2 predict:   PLACING(value?, confidence?) --commit (needs both)--> REVEALED (inputs locked,
                  overlay prediction vs actual) --save "explain the gap" text--> GAP_SAVED [done]
     3 explore:   LOCKED (until predict committed; enforced by step order)
                  PAUSED (initial; nothing animates) <--> ADJUSTED (any control) --reset--> PAUSED
                  checkpoint q1,q2 each: OPEN --check wrong--> RETRY --check right--> CORRECT
                                         OPEN/RETRY --reveal--> REVEALED
                  hint ladder: H0 -> H1 nudge -> H2 principle -> H3 worked step (correct afterwards = hinted-correct)
                  [done when q1 and q2 are CORRECT or REVEALED]
     4 explain:   CHOOSING --submit (principle + because-text)--> GRADED_CHOICE + MODEL_SHOWN
                  --save rubric self-check--> SELF_ASSESSED [done]
     5 formalize: VIEWED [done on entry]
     6 worked:    W1 (fully worked) --self-explain + reveal--> W2 (last step blank: OPEN/RETRY/
                  CORRECT/REVEALED, hints) --> W3 (independent, same states) [done when W2,W3 resolved]
     7 check:     per MCQ: ANSWER -> REASON -> CONFIDENCE -> SUBMITTED(feedback; RETEACH if
                  confident & wrong)  [done when all submitted]
     8 transfer:  ANSWER -> REASON -> CONFIDENCE -> SUBMITTED --explain + self-check--> SAVED [done]
     9 exit:      ANSWERING (no hints; sim not shown; visiting Explore/Predict marks PEEKED)
                  --submit all--> SUBMITTED [done]
    10 results:   REPORT; flashcard review: FRONT --show--> BACK --again|good--> next due card
                  (schedule persisted separately); exports download .txt files
   ===================================================================== */
'use strict';

/* ---------- Storage (versioned, never trusted) ---------- */
/* CONTENT: storage keys — change the slug for a new lab */
const STORAGE_KEY = 'myelinate:lab:oxygen-hb:v1';
const CARDS_KEY = 'myelinate:cards:oxygen-hb:v1';
const store = (() => {
  let ok = true;
  try { const k = '__myelinate_probe__'; window.localStorage.setItem(k, '1'); window.localStorage.removeItem(k); } catch (e) { ok = false; }
  return {
    get ok() { return ok; },
    get(k) { if (!ok) return null; try { const raw = window.localStorage.getItem(k); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } },
    set(k, v) { if (!ok) return false; try { window.localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { ok = false; renderNotices(); return false; } },
    del(k) { try { window.localStorage.removeItem(k); } catch (e) { /* ignore */ } }
  };
})();

/* =====================================================================
   CONTENT: MODEL — the quantitative model behind Predict + Explore.
   Replace this object (and drawSim/readouts) to build a lab on another topic.
   ===================================================================== */
const MODEL = {
  P50_ADULT: 26.6,   // mmHg at pH 7.40, PCO2 40, 37 °C (Severinghaus 1979; OpenAnesthesia)
  P50_FETAL: 19.0,   // mmHg (Deranged Physiology; OpenAnesthesia 18–19)
  N: 2.7,            // Hill coefficient (approximation over the physiologic range)
  BOHR: -0.52,       // Δlog10 P50 / ΔpH, from Severinghaus 1979 Eq. 4 evaluated at P50 (−1.2 ln units)
  TEMP: 0.024,       // Δlog10 P50 / °C at constant pH (approximate; see Model notes)
  BPG: { low: -0.15, normal: 0, high: 0.06 },  // Δlog10 P50: depleted (stored blood) / normal / raised (altitude) — approximate
  CO_COEF: 0.00848,  // Δlog10 P50 per % COHb (Rovida et al. 1984, valid 0–23% COHb)
  COHB_PCT: 20,
  HB: 15, HUFNER: 1.34, // g/dL; mL O2 per g Hb
  PH0: 7.4, T0: 37, PCO2_0: 40,
  p50(c) {
    const base = c.fetal ? this.P50_FETAL : this.P50_ADULT;
    const lg = this.BOHR * (c.pH - this.PH0) + this.TEMP * (c.temp - this.T0)
      + (c.fetal ? 0 : this.BPG[c.bpg]) - (c.co ? this.CO_COEF * this.COHB_PCT : 0);
    return base * Math.pow(10, lg);
  },
  hill(po2, p50) { if (po2 <= 0) return 0; const a = Math.pow(po2, this.N); return a / (a + Math.pow(p50, this.N)); },
  coFrac(c) { return c.co ? this.COHB_PCT / 100 : 0; },
  hbo2(po2, c) { return (1 - this.coFrac(c)) * this.hill(po2, this.p50(c)); },   // fraction of TOTAL Hb carrying O2
  capacity() { return this.HB * this.HUFNER; }                                   // mL O2 / dL at 100% (bound only)
};
const STANDARD = { pH: 7.4, temp: 37, bpg: 'normal', fetal: false, co: false };
const PO2 = { art: 100, rest: 40, sprint: 20 };
const pct = s => Math.round(s * 100);
const r1 = x => (Math.round(x * 10) / 10).toFixed(1);

/* =====================================================================
   CONTENT: learning targets (results page reports state per target)
   ===================================================================== */
const TARGETS = [
  { id: 'T1', name: 'Read the curve', desc: 'Read saturation at a PO₂ and compute O₂ unloaded (lungs − tissue).' },
  { id: 'T2', name: 'Predict the shift', desc: 'Predict the direction of a shift from pH, CO₂, temperature, 2,3-BPG.' },
  { id: 'T3', name: 'Explain the payoff', desc: 'Explain why a right shift increases O₂ delivery at the same tissue PO₂.' },
  { id: 'T4', name: 'Apply to special cases', desc: 'Apply affinity reasoning to fetal Hb, CO, stored blood, altitude.' }
];

/* =====================================================================
   CONTENT: steps (ids drive the renderers below)
   ===================================================================== */
const STEPS = [
  { id: 'hook', name: 'Puzzle' }, { id: 'parts', name: 'Meet the parts' }, { id: 'predict', name: 'Predict' },
  { id: 'explore', name: 'Explore' }, { id: 'explain', name: 'Explain' }, { id: 'formalize', name: 'Formalize' },
  { id: 'worked', name: 'Worked examples' }, { id: 'check', name: 'Check yourself' }, { id: 'transfer', name: 'Transfer' },
  { id: 'exit', name: 'Exit ticket' }, { id: 'results', name: 'Results & review' }
];

/* CONTENT: hook */
const HOOK = {
  title: 'Same blood in. Very different oxygen out.',
  body: [
    'Blood reaching your thigh muscle arrives with an arterial PO₂ of about 100 mmHg, whether you are sitting still or sprinting.',
    'At rest, the muscle takes only about a quarter of the O₂ that hemoglobin is carrying. Mid-sprint, the same muscle can strip out most of it.'
  ],
  question: 'What could make hemoglobin give up so much more O₂ when the blood coming in looks the same?'
};

/* CONTENT: pre-training terms (keep tiny, ~20 s) */
const TERMS = [
  { id: 'po2', name: 'PO₂ (x-axis)', def: 'Partial pressure of dissolved O₂, in mmHg: the "push" loading O₂ onto hemoglobin. About 100 mmHg leaving the lungs; lower in working tissue.' },
  { id: 'sat', name: 'Saturation (y-axis)', def: 'The percent of hemoglobin\'s O₂-binding hemes that are occupied. Each Hb molecule has 4 hemes.' },
  { id: 'p50', name: 'P50', def: 'The PO₂ at which hemoglobin is 50% saturated. One number that tells you where the whole curve sits.' },
  { id: 'aff', name: 'Affinity', def: 'How tightly Hb holds O₂. Higher affinity → half-saturated at a lower PO₂ → lower P50. Lower affinity → higher P50.' }
];

/* CONTENT: explore guidance + hint ladder (applies to the checkpoint) */
const DRIVING = [
  'Under standard conditions, find how much saturation blood gives up between the lungs (100 mmHg) and resting tissue (40 mmHg).',
  'Make the tissue look like a sprinting muscle: lower pH, raise PCO₂ and temperature. What happens to P50 and to unloading?',
  'Which single change moves resting unloading the most? Try fetal Hb and CO last. What do they do to the arterial point?'
];
const EXPLORE_HINTS = [
  { k: 'Nudge', t: 'Unloading is a difference: what left the lungs minus what is still bound in the tissue. Find both points on the chart.' },
  { k: 'Principle', t: 'Blood loads on the dashed "lungs" curve at 100 mmHg and unloads on the solid "tissue" curve at the tissue PO₂. The bars on the right are exactly that difference.' },
  { k: 'Worked step', t: () => `Standard conditions: ${pct(MODEL.hbo2(100, STANDARD))}% − ${pct(MODEL.hbo2(40, STANDARD))}% ≈ ${pct(MODEL.hbo2(100, STANDARD)) - pct(MODEL.hbo2(40, STANDARD))} points. Then press "Sprinting muscle" and divide the sprint bar by the resting value under standard conditions.` }
];
const CHECKPOINT = {
  q1: { target: 'T1', label: 'Explore: unloading at rest', prompt: 'Under standard conditions, how many percentage points of saturation does blood unload between the lungs (100 mmHg) and resting tissue (40 mmHg)?',
    answer: () => pct(MODEL.hbo2(100, STANDARD)) - pct(MODEL.hbo2(40, STANDARD)), tol: 2 },
  q2: { target: 'T3', label: 'Explore: sprint vs rest', prompt: 'Press "Sprinting muscle" (tissue pH 7.20, PCO₂ 60, 39 °C, tissue PO₂ 20). Compared with resting unloading under standard conditions, the sprint unloads about…',
    options: [{ id: 'a', t: 'the same amount' }, { id: 'b', t: '1.5 times as much' }, { id: 'c', t: 'twice as much' }, { id: 'd', t: 'more than three times as much' }], correct: 'd',
    why: 'Two effects stack: tissue PO₂ falls into the steep part of the curve, and acid, CO₂ and heat shift the tissue curve right (higher P50), so even less O₂ stays bound at that PO₂.' }
};

/* CONTENT: self-explanation (explain step) */
const EXPLAIN = {
  prompt: 'Back to the puzzle: which principle best explains why the sprinting muscle receives so much more O₂?',
  options: [
    { id: 'a', t: 'Blood flows faster during a sprint, so hemoglobin is more saturated when it leaves the lungs.' },
    { id: 'b', t: 'Working muscle makes hemoglobin bind O₂ more tightly, so each Hb carries more O₂ to the tissue.' },
    { id: 'c', t: 'In working muscle, PO₂ is lower and acid, CO₂ and heat lower Hb\'s affinity (right shift), so at that PO₂ much less O₂ stays bound.' },
    { id: 'd', t: 'Myoglobin in the muscle pulls O₂ off hemoglobin no matter what the blood conditions are.' }
  ],
  correct: 'c',
  feedback: {
    a: 'Arterial saturation is already ~97% at rest; there is almost no room to load more. Faster flow raises delivery per minute, but it does not explain why each dL of blood gives up more.',
    b: 'This reverses the effect. Working-muscle conditions lower affinity. Tighter binding would make Hb keep its O₂.',
    c: 'Yes. Lower tissue PO₂ and a right-shifted curve stack.',
    d: 'Myoglobin does accept O₂ in muscle, but it can only take what hemoglobin releases at the capillary PO₂, and that depends on Hb affinity.'
  },
  model: 'Blood loads to ~97% in the lungs either way. In sprinting muscle, tissue PO₂ drops toward ~20 mmHg, onto the steep part of the curve, and H⁺, CO₂ and heat lower hemoglobin\'s O₂ affinity (Bohr effect and temperature), shifting the curve right. At the same PO₂ a right-shifted Hb holds less O₂, so the difference between loading and unloading, which is what the muscle receives, grows several-fold.',
  rubric: [
    'I said the tissue PO₂ is lower, landing on the steep part of the curve.',
    'I named a cause of lower affinity (H⁺/acid, CO₂, or temperature).',
    'I linked lower affinity to less O₂ staying bound at the same PO₂.',
    'I did not claim hemoglobin carries or loads more O₂.'
  ]
};

/* CONTENT: worked examples (fading) */
const WORKED = {
  w2: { target: 'T1', label: 'Worked 2: sprint PO₂, last step', answer: () => pct(MODEL.hbo2(100, STANDARD)) - pct(MODEL.hbo2(20, STANDARD)), tol: 2,
    hints: [
      { k: 'Nudge', t: 'Steps 1 and 2 already gave you both saturations. What operation gives "given up"?' },
      { k: 'Principle', t: 'Unloaded = saturation leaving lungs − saturation remaining in tissue.' },
      { k: 'Worked step', t: () => `${pct(MODEL.hbo2(100, STANDARD))} − ${pct(MODEL.hbo2(20, STANDARD))} = ?` }
    ] },
  w3: { target: 'T3', label: 'Worked 3: acidic tissue (independent)', answer: () => pct(MODEL.hbo2(100, STANDARD)) - pct(MODEL.hbo2(40, { ...STANDARD, pH: 7.2 })), tol: 1,
    trap: () => pct(MODEL.hbo2(100, { ...STANDARD, pH: 7.2 })) - pct(MODEL.hbo2(40, { ...STANDARD, pH: 7.2 })),
    hints: [
      { k: 'Nudge', t: 'Where was the blood, and what was its pH, when it loaded O₂?' },
      { k: 'Principle', t: 'Loading happens on the lungs curve (pH 7.40). Only the unloading happens on the acidic tissue curve.' },
      { k: 'Worked step', t: () => `Leaving lungs: ${pct(MODEL.hbo2(100, STANDARD))}%. In tissue at pH 7.20 and 40 mmHg: ${pct(MODEL.hbo2(40, { ...STANDARD, pH: 7.2 }))}%. Subtract.` }
    ] }
};

/* CONTENT: misconception-based MCQs (interleaved across targets).
   Each wrong option names the misconception it was written from. */
const MCQ = [
  { id: 'm1', target: 'T1', label: 'Contrast: P50 20 vs 34',
    stem: () => `Contrasting cases. Two blood samples both load in the lungs at 100 mmHg. Sample X has P50 = 20 mmHg; sample Y has P50 = 34 mmHg. At a tissue PO₂ of 40 mmHg, which unloads more O₂?`,
    options: [
      { id: 'a', t: 'X, because its curve sits higher, and a higher curve delivers more O₂.', mis: 'Higher curve = better delivery', fb: () => `A higher curve is higher everywhere, including in the tissue, so X keeps more bound. X: ${pct(MODEL.hill(100, 20))}% → ${pct(MODEL.hill(40, 20))}% (gives up ${pct(MODEL.hill(100, 20)) - pct(MODEL.hill(40, 20))}). Y: ${pct(MODEL.hill(100, 34))}% → ${pct(MODEL.hill(40, 34))}% (gives up ${pct(MODEL.hill(100, 34)) - pct(MODEL.hill(40, 34))}).` },
      { id: 'b', t: 'Y, because its higher P50 means lower affinity, so less O₂ stays bound at 40 mmHg.', fb: () => `Right. Y loads almost as well (${pct(MODEL.hill(100, 34))}% vs ${pct(MODEL.hill(100, 20))}%) but holds only ${pct(MODEL.hill(40, 34))}% at 40 mmHg vs ${pct(MODEL.hill(40, 20))}% for X.` },
      { id: 'c', t: 'X, because a lower P50 means lower affinity, so it lets go more easily.', mis: 'P50 read backwards', fb: () => 'P50 is the PO₂ needed to half-fill Hb. Needing less PO₂ (lower P50) means Hb grabs O₂ more readily: higher affinity.' },
      { id: 'd', t: 'Neither. Both are nearly full at 100 mmHg and the tissue PO₂ is the same, so they unload equally.', mis: 'PO₂ alone sets saturation', fb: () => 'Saturation depends on PO₂ and on affinity. At the same 40 mmHg, the two curves sit at very different heights.' }
    ], correct: 'b',
    reasons: [{ id: 'r1', t: 'Loading in the lungs determines how much is delivered.' }, { id: 'r2', t: 'At the same tissue PO₂, the lower-affinity sample leaves less O₂ bound.' }, { id: 'r3', t: 'PO₂ alone determines how much O₂ is released.' }], reasonCorrect: 'r2',
    reteach: { title: 'Delivery is a difference, not a height', body: () => `Picture two staircases. Delivery is how far you step down between 100 and 40 mmHg, not how high the top step is. Right-shifted Y steps down ${pct(MODEL.hill(100, 34)) - pct(MODEL.hill(40, 34))} points; left-shifted X steps down only ${pct(MODEL.hill(100, 20)) - pct(MODEL.hill(40, 20))}.` } },
  { id: 'm2', target: 'T2', label: 'Exercise: heat + acid',
    stem: () => 'During exercise, muscle temperature rises and capillary pH falls. Compared with resting muscle at the same PO₂, hemoglobin saturation in the exercising muscle capillary is…',
    options: [
      { id: 'a', t: 'Higher, because a right shift means Hb carries more O₂ to working muscle.', mis: 'Right shift = Hb carries more O₂', fb: () => 'A right shift lowers affinity. At any given PO₂, a right-shifted Hb holds less O₂, which is exactly why more gets released.' },
      { id: 'b', t: 'Unchanged, because saturation depends only on PO₂.', mis: 'PO₂ alone sets saturation', fb: () => 'H⁺ and heat change how tightly Hb holds O₂, so the same PO₂ gives a different saturation.' },
      { id: 'c', t: 'Lower, because acid and heat lower Hb\'s O₂ affinity (right shift).', fb: () => 'Right. This is the Bohr effect (H⁺, CO₂) plus the temperature effect: O₂ binding is exothermic, so heat lowers affinity.' },
      { id: 'd', t: 'Lower, because acid destroys some hemoglobin so fewer sites are left.', mis: 'Acid denatures Hb', fb: () => 'Physiologic acidosis (pH ~7.2) does not destroy Hb. H⁺ binds and stabilizes the deoxy (T) state, which lowers affinity reversibly.' }
    ], correct: 'c',
    reasons: [{ id: 'r1', t: 'H⁺ stabilizes the deoxy (T) state, and heat weakens O₂ binding (binding is exothermic), so O₂ comes off more easily.' }, { id: 'r2', t: 'The muscle uses O₂ faster, which lowers saturation at the same PO₂.' }, { id: 'r3', t: 'Acid dissolves more O₂ in plasma, leaving less for Hb.' }], reasonCorrect: 'r1',
    reteach: { title: 'Right shift means a looser grip, not a bigger load', body: () => `At 40 mmHg under standard conditions Hb is ${pct(MODEL.hbo2(40, STANDARD))}% saturated. Drop tissue pH to 7.20 and warm it to 39 °C, and the same 40 mmHg gives ${pct(MODEL.hbo2(40, { ...STANDARD, pH: 7.2, temp: 39 }))}%. That missing O₂ went into the muscle.` } },
  { id: 'm3', target: 'T4', label: 'Fetal hemoglobin',
    stem: () => 'At the placenta, maternal and fetal blood are exposed to the same low PO₂. Compared with maternal HbA, fetal HbF at that PO₂ is…',
    options: [
      { id: 'a', t: 'Less saturated. HbF has lower affinity so it can release O₂ to fetal tissues.', mis: 'Fetal Hb has lower affinity', fb: () => 'HbF has higher affinity (P50 ≈ 19 vs ≈ 27 mmHg), not lower. O₂ diffuses down its PO₂ gradient, from maternal to fetal plasma. At the low placental PO₂, higher-affinity HbF loads more O₂, which keeps fetal plasma PO₂ low so the gradient persists, and fetal blood leaves the placenta carrying more O₂.' },
      { id: 'b', t: 'More saturated, because HbF binds 2,3-BPG more strongly.', mis: 'BPG effect reversed', fb: () => '2,3-BPG lowers affinity. HbF\'s γ chains bind 2,3-BPG weakly, so HbF escapes that right shift. Stronger BPG binding would lower its affinity.' },
      { id: 'c', t: 'More saturated, because HbF binds 2,3-BPG weakly and so has higher O₂ affinity.', fb: () => 'Right. HbF is left-shifted (P50 ≈ 19 mmHg), so at placental PO₂ it is more saturated than maternal HbA. O₂ diffuses down its PO₂ gradient, from maternal to fetal plasma. At the low placental PO₂, higher-affinity HbF loads more O₂, which keeps fetal plasma PO₂ low so the gradient persists, and fetal blood leaves the placenta carrying more O₂.' },
      { id: 'd', t: 'Equally saturated. O₂ moves only because the fetus has more hemoglobin.', mis: 'Only Hb amount matters', fb: () => 'Fetal Hb concentration is higher, but affinity also differs. At the same PO₂, HbF is more saturated.' }
    ], correct: 'c',
    reasons: [{ id: 'r1', t: 'The fetus needs Hb that releases O₂ easily.' }, { id: 'r2', t: 'HbF\'s γ chains bind 2,3-BPG weakly, leaving it left-shifted.' }, { id: 'r3', t: 'The placenta actively pumps O₂ into the fetus.' }], reasonCorrect: 'r2',
    reteach: { title: 'O₂ follows its PO₂ gradient; HbF keeps the gradient going', body: () => `At a placental PO₂ of 30 mmHg in this model, adult Hb is ${pct(MODEL.hbo2(30, STANDARD))}% saturated and fetal Hb is ${pct(MODEL.hbo2(30, { ...STANDARD, fetal: true }))}%. O₂ diffuses down its PO₂ gradient, from maternal to fetal plasma. At the low placental PO₂, higher-affinity HbF loads more O₂, which keeps fetal plasma PO₂ low so the gradient persists, and fetal blood leaves the placenta carrying more O₂.` } },
  { id: 'm4', target: 'T3', label: 'What a right shift does',
    stem: () => 'Which statement about a right-shifted O₂–Hb curve is correct?',
    options: [
      { id: 'a', t: 'Hb carries more O₂, so more reaches the tissue.', mis: 'Right shift = Hb carries more O₂', fb: () => 'Loading in the lungs barely changes (the top of the curve is flat). The gain comes from Hb holding less at tissue PO₂.' },
      { id: 'b', t: 'Hb binds O₂ more tightly, so other tissues can\'t steal it on the way.', mis: 'Affinity direction reversed', fb: () => 'Right shift = lower affinity. Tighter binding is a left shift.' },
      { id: 'c', t: 'Arterial PO₂ rises, pushing more O₂ into tissue.', mis: 'Confusing PO₂ with saturation', fb: () => 'The shift changes saturation at a given PO₂. It does not change the PO₂ itself.' },
      { id: 'd', t: 'At any given PO₂, Hb is less saturated, so more O₂ is released for the same drop in PO₂.', fb: () => 'Right. Same PO₂ drop, bigger saturation drop, more O₂ delivered.' }
    ], correct: 'd',
    reasons: [{ id: 'r1', t: 'Lower affinity means less O₂ stays bound at tissue PO₂.' }, { id: 'r2', t: 'The shift raises the plateau, so Hb loads more in the lungs.' }, { id: 'r3', t: 'The shift increases dissolved O₂ in plasma.' }], reasonCorrect: 'r1',
    reteach: { title: 'Watch the tissue end of the curve', body: () => `Under standard conditions vs tissue pH 7.20: at 100 mmHg, ${pct(MODEL.hbo2(100, STANDARD))}% vs ${pct(MODEL.hbo2(100, { ...STANDARD, pH: 7.2 }))}% (almost the same). At 40 mmHg, ${pct(MODEL.hbo2(40, STANDARD))}% vs ${pct(MODEL.hbo2(40, { ...STANDARD, pH: 7.2 }))}% (a big difference). The payoff is at the tissue end.` } },
  { id: 'm5', target: 'T2', label: 'Hyperventilation (low CO₂)',
    stem: () => 'Someone hyperventilates and their PCO₂ falls to 25 mmHg. Which way does the O₂–Hb curve shift?',
    options: [

/* CONTENT: sources & model notes (only what was actually checked) */
const SOURCES_HTML = `
<ul>
  <li><strong>Betts JG et al. <em>Anatomy and Physiology 2e</em>, §22.5 Transport of Gases.</strong> OpenStax. <a href="https://openstax.org/books/anatomy-and-physiology/pages/22-5-transport-of-gases" target="_blank" rel="noopener">openstax.org</a>. Direction of the pH, temperature, 2,3-BPG and CO₂ effects; fetal Hb has higher affinity; healthy saturation 95–99%.</li>
  <li><strong>Severinghaus JW. Simple, accurate equations for human blood O₂ dissociation computations.</strong> <em>J Appl Physiol</em> 1979;46(3):599–602. PMID 35496. Standard curve, P50 26.6 mmHg; Eq. 4 gives Δln PO₂/ΔpH = (PO₂/26.6)<sup>0.184</sup> − 2.2, which at P50 is −1.2 ln units, ≈ −0.52 log₁₀ units per pH unit (the Bohr coefficient used here).</li>
  <li><strong>Rovida E, Niggeler M, Carlone S, Samaja M. Carboxyhemoglobin and oxygen affinity of human blood.</strong> <em>Clin Chem</em> 1984;30(7):1250–1. PMID 6428779. d(log P50)/d[COHb%] = 0.00848, valid 0–23% COHb.</li>
  <li><strong>Lenfant C et al. Effect of altitude on oxygen binding by hemoglobin and on organic phosphate levels.</strong> <em>J Clin Invest</em> 1968;47:2652–6. Hb affinity falls within ~24 h of ascent, with 2,3-DPG rising in parallel.</li>
  <li><strong>McLellan SA. The red cell storage lesion and therapeutic blood transfusion in the critically ill patient</strong> (thesis, Univ. Edinburgh, 2006). About 50% of 2,3-DPG lost by storage day 2, rarely detectable by day 14; P50 falls in parallel. Also Kassa T et al., <em>Front Physiol</em> 2024 (PMID 39224206): stored-RBC P50 fell from ~30 to ~20 mmHg.</li>
  <li><strong>Fetal Hb P50 ≈ 19 mmHg vs adult ≈ 26.6–26.7</strong>: <a href="https://derangedphysiology.com/main/cicm-primary-exam/required-reading/respiratory-system/Chapter%20124/physiology-and-consequences-foetal-haemoglobin" target="_blank" rel="noopener">Deranged Physiology</a>; <a href="https://www.openanesthesia.org/age-related_p50/" target="_blank" rel="noopener">OpenAnesthesia</a> (18–19 mmHg).</li>
</ul>
<h4 style="margin:14px 0 6px">Model notes (read these before trusting a decimal)</h4>
<ul>
  <li><strong>Curve:</strong> Hill equation S = PO₂ⁿ / (P50ⁿ + PO₂ⁿ), n = 2.7, P50 = 26.6 mmHg. Standard values: S(100) = ${r1(100 * MODEL.hill(100, 26.6))}%, S(40) = ${r1(100 * MODEL.hill(40, 26.6))}%, S(20) = ${r1(100 * MODEL.hill(20, 26.6))}%. A single Hill n slightly underestimates the low tail compared with Severinghaus' equation (≈ 32% at 20 mmHg).</li>
  <li><strong>Shifts</strong> are applied as log₁₀ P50 = log₁₀ P50₀ − 0.52·(pH − 7.40) + 0.024·(T − 37) + BPG term − 0.00848·%COHb. The Bohr coefficient varies with saturation, 2,3-BPG and the acid source (Severinghaus 1979; Duhm 1976), so treat it as approximate. Tissue pH 7.20 gives P50 ≈ ${r1(MODEL.p50({ ...STANDARD, pH: 7.2 }))} mmHg.</li>
  <li><strong>Temperature (approximate):</strong> Severinghaus Eq. 3 gives ≈ 0.031 log units/°C for a sealed blood sample, where pH also falls with warming. Removing that Bohr component (≈ 0.52 × 0.015 pH/°C) leaves ≈ 0.023; we use 0.024 at constant pH.</li>
  <li><strong>PCO₂</strong> acts here only through pH, using Henderson–Hasselbalch with bicarbonate fixed (ΔpH = −log₁₀(PCO₂/40)). Real blood buffering makes the pH change somewhat smaller, and the direct carbamino effect is ignored. Displayed pH is held within 7.20–7.60, the range where Bohr data were collected.</li>
  <li><strong>2,3-BPG levels</strong> are illustrative: low (stored blood) Δlog P50 = −0.15 (P50 ≈ ${r1(MODEL.p50({ ...STANDARD, bpg: 'low' }))}); high (altitude) +0.06 (P50 ≈ ${r1(MODEL.p50({ ...STANDARD, bpg: 'high' }))}). Fetal Hb is modeled as unresponsive to 2,3-BPG, a simplification of "weakly responsive".</li>

function defaultSim() { return { m: 7.40, pco2: 40, temp: 37, bpg: 'normal', fetal: false, co: false, probe: 60, inst: 'rest' }; }
function freshState() {

    predict: { value: null, conf: null, committed: false, gap: '', gapSaved: false },

}
let S = loadState();
function loadState() {
  const saved = store.get(STORAGE_KEY);
  if (saved && saved.v === 1) { const base = freshState(); return deepMerge(base, saved); }
  return freshState();
}
function deepMerge(base, over) {
  for (const k of Object.keys(over)) {
    if (over[k] && typeof over[k] === 'object' && !Array.isArray(over[k]) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) base[k] = deepMerge(base[k], over[k]);
    else base[k] = over[k];
  }
  return base;
}
function save() { store.set(STORAGE_KEY, S); }
const resumed = S.step > 0 || S.maxReached > 0;

const $ = id => document.getElementById(id);

const val = x => (typeof x === 'function' ? x() : x);

/* Graded-item ledger: honest record of how each answer was reached */
function item(id, meta) {
  if (!S.items[id]) S.items[id] = { id, target: meta.target, label: meta.label, attempts: 0, correct: false, hint: 0, revealed: false, ts: 0 };

}
function itemStatus(it) {
  if (it.revealed && !it.correct) return 'revealed';
  if (it.correct && it.attempts === 1 && !it.hint) return 'unassisted-correct';
  if (it.correct) return 'hinted-correct';
  if (it.attempts > 0) return 'incorrect';

}

function go(i, opts = {}) {
  if (i < 0 || i >= STEPS.length) return;

function confPills(name, selected, disabled) {

const CH = { w: 600, h: 400, ml: 58, mr: 22, mt: 18, mb: 52, xmax: 110 };
function sizeChart() { const narrow = window.matchMedia('(max-width: 700px)').matches; CH.w = narrow ? 430 : 600; CH.h = narrow ? 380 : 400; CH.ml = narrow ? 54 : 58; return narrow; }
let lastNarrow = sizeChart();
window.addEventListener('resize', () => { const n = window.matchMedia('(max-width: 700px)').matches; if (n !== lastNarrow) { lastNarrow = sizeChart(); rerenderKeepScroll(); } });
const X = p => CH.ml + (p / CH.xmax) * (CH.w - CH.ml - CH.mr);
const Y = s => CH.mt + (1 - s) * (CH.h - CH.mt - CH.mb);
function axes(opts = {}) {
  let g = '';
  for (let p = 0; p <= 100; p += 20) g += `<line class="grid" x1="${X(p)}" x2="${X(p)}" y1="${Y(1)}" y2="${Y(0)}"/><text class="tick" x="${X(p)}" y="${Y(0) + 18}" text-anchor="middle">${p}</text>`;
  for (let s = 0; s <= 1.0001; s += 0.25) g += `<line class="grid" x1="${X(0)}" x2="${X(CH.xmax)}" y1="${Y(s)}" y2="${Y(s)}"/><text class="tick" x="${X(0) - 8}" y="${Y(s) + 4}" text-anchor="end">${Math.round(s * 100)}</text>`;
  g += `<line class="axis" x1="${X(0)}" x2="${X(CH.xmax)}" y1="${Y(0)}" y2="${Y(0)}"/><line class="axis" x1="${X(0)}" x2="${X(0)}" y1="${Y(0)}" y2="${Y(1)}"/>`;
  g += `<text class="axis-title" x="${(X(0) + X(CH.xmax)) / 2}" y="${CH.h - 10}" text-anchor="middle">PO₂ (mmHg)</text>`;
  g += `<text class="axis-title" transform="translate(16 ${(Y(0) + Y(1)) / 2}) rotate(-90)" text-anchor="middle">${opts.yTitle || 'O₂ saturation (%)'}</text>`;
  return g;
}
function curvePath(fn) { let d = ''; for (let p = 0; p <= CH.xmax; p += 0.5) d += (p === 0 ? 'M' : 'L') + X(p).toFixed(1) + ' ' + Y(fn(p)).toFixed(1); return d; }
function lab(x, y, text, cls, anchor = 'start') { return `<text class="lab ${cls} halo" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}">${text}</text>`; }

function simCond() {
  const s = S.sim; const raw = s.m - Math.log10(s.pco2 / 40);
  const pH = Math.min(7.6, Math.max(7.2, raw));
  return { tissue: { pH, temp: s.temp, bpg: s.bpg, fetal: s.fetal, co: s.co }, lungs: { pH: 7.4, temp: 37, bpg: s.bpg, fetal: s.fetal, co: s.co }, rawPH: raw, clamped: Math.abs(raw - pH) > 1e-6 };
}
function simNumbers() {

  const stdArt = MODEL.hbo2(100, STANDARD), stdRest = MODEL.hbo2(40, STANDARD), stdSpr = MODEL.hbo2(20, STANDARD);
  return { c, art, rest, spr, probe, p50t: MODEL.p50(c.tissue), p50l: MODEL.p50(c.lungs), unRest: pct(art) - pct(rest), unSpr: pct(art) - pct(spr), stdUnRest: pct(stdArt) - pct(stdRest), stdUnSpr: pct(stdArt) - pct(stdSpr) };
}
function simSVG(N) {

  if (c.tissue.co) g += `<line class="guide" x1="${X(0)}" x2="${X(CH.xmax)}" y1="${Y(1 - MODEL.coFrac(c.tissue))}" y2="${Y(1 - MODEL.coFrac(c.tissue))}" style="stroke:var(--bad)"/>` + lab(X(4), Y(1 - MODEL.coFrac(c.tissue)) - 6, `max with ${MODEL.COHB_PCT}% COHb`, 'lab-sm');
  if (!same) g += `<path class="c-ref" d="${curvePath(fl)}"/>`;

  if (review.i >= review.queue.length) return `<div class="fb good"><strong class="tag">Review done.</strong>Next due dates are in the list below. Come back when cards are due; spacing is what makes this work.</div><div class="btn-row"><button class="btn secondary" type="button" data-act="rv-reset">Back to deck</button></div>`;
  const c = review.queue[review.i];
  return `<div class="fc" aria-live="polite"><p class="side">Card ${review.i + 1} of ${review.queue.length} · Front</p><p class="face">${esc(c.q)}</p>
    ${review.showing ? `<div class="back"><p class="side">Back</p><p style="margin:.3em 0 0;font-size:1.05rem">${esc(c.a)}</p></div>` : ''}</div>

R.results = () => {
  const graded = Object.values(S.items).filter(i => i.attempts > 0 || i.revealed);
  const cnt = { 'unassisted-correct': 0, 'hinted-correct': 0, revealed: 0, incorrect: 0 }; graded.forEach(i => { const s = itemStatus(i); if (cnt[s] != null) cnt[s]++; });
  const order = ['q1', 'q2', 'w2', 'w3', 'xc', ...MCQ.map(q => q.id), 'tr', ...EXIT.map(e => e.id)];
  const rows = order.filter(id => S.items[id]).map(id => { const it = S.items[id]; const [l, c] = STATUS_LABEL[itemStatus(it)]; const tg = TARGETS.find(t => t.id === it.target);
    return `<tr><td>${esc(it.label)}</td><td>${esc(tg.name)}</td><td><span class="badge ${c}">${l}</span></td><td class="small muted">${it.hint ? `${it.hint} hint${it.hint > 1 ? 's' : ''}` : ''}${it.attempts > 1 ? `${it.hint ? ', ' : ''}${it.attempts} tries` : ''}${it.conf ? `${it.hint || it.attempts > 1 ? ', ' : ''}${({ sure: 'sure', fairly: 'fairly sure', guess: 'guessing' })[it.conf]}` : ''}</td></tr>`; }).join('');

  const p = S.predict;
  const selfRows = [
    ['First guess (puzzle)', S.hook.done ? (S.hook.skipped ? 'No guess recorded' : 'Written') : 'Not done'],
    ['Prediction', p.committed ? `${p.value}% predicted vs ${pct(MODEL.hbo2(40, STANDARD))}% (${({ sure: 'sure', fairly: 'fairly sure', guess: 'guessing' })[p.conf]}); gap explained: ${p.gapSaved ? 'yes' : 'no'}` : 'Not done'],
    ['Explain: "because…"', S.explain.saved ? `Self-check ${S.explain.rubric.length}/${EXPLAIN.rubric.length}` : 'Not done'],
    ['Worked 1 self-explanation', S.worked.w1done ? 'Written' : 'Not done'],
    ['Transfer explanation', S.transfer.saved ? `Self-check ${S.transfer.rubric.length}/${TRANSFER.rubric.length}` : 'Not done']
  ].map(([a, b]) => `<tr><td>${esc(a)}</td><td>${esc(b)}</td><td>${b === 'Not done' ? '' : '<span class="badge">self-assessed</span>'}</td></tr>`).join('');
  const needs = TARGETS.filter(t => targetState(t.id)[0] === 'Needs support');
  return `${stepHead('Results & review', 'What this session actually shows', 'Every scored item is labeled unassisted-correct, hinted-correct, revealed or incorrect. Explanations you judged yourself are labeled self-assessed and are not scored.')}
  <div class="stack">
    <div class="stats">
      <div class="stat"><b>${cnt['unassisted-correct']}</b><span>unassisted-correct</span></div>
      <div class="stat"><b>${cnt['hinted-correct']}</b><span>hinted-correct (after a hint or retry)</span></div>
      <div class="stat"><b>${cnt.revealed}</b><span>revealed (exposure, not success)</span></div>

    </div>
    <section class="card" aria-labelledby="tgH"><h3 id="tgH">By learning target</h3><div class="tbl-wrap"><table class="res"><thead><tr><th>Target</th><th>State</th><th>Evidence</th></tr></thead><tbody>
      ${TARGETS.map(t => { const [s, c] = targetState(t.id); const its = Object.values(S.items).filter(i => i.target === t.id && (i.attempts || i.revealed)); const ind = its.filter(i => itemStatus(i) === 'unassisted-correct').length; const l3 = its.sort((a, b) => a.ts - b.ts).slice(-3).map(itemStatus);
        return `<tr><td><strong>${esc(t.name)}</strong><br><span class="small muted">${esc(t.desc)}</span></td><td><span class="badge ${c}">${s}</span></td><td class="small">${its.length ? `${ind} of ${its.length} items unassisted-correct. Last ${l3.length}: ${l3.join(', ')}.` : 'No attempts yet.'}</td></tr>`; }).join('')}
      </tbody></table></div>
      <p class="small"><strong>${TARGET_RULE}</strong></p>
      <p class="small muted">"Independent this session" is not durable mastery. Retrieval after a delay (the flashcards below) is the next test.${confWrong ? ` You were confident and wrong ${confWrong} time${confWrong > 1 ? 's' : ''}; those reteach cards are the best place to start.` : ''}</p>
      ${needs.length ? `<p><strong>Next move:</strong> revisit ${needs.map(t => esc(t.name)).join(', ')}. Re-run Explore with a specific question, then try the matching flashcards tomorrow.</p>` : ''}</section>

    <section class="card" aria-labelledby="saH"><h3 id="saH">self-assessed (not scored)</h3><div class="tbl-wrap"><table class="res"><thead><tr><th>Work</th><th>Result</th><th>Outcome</th></tr></thead><tbody>${selfRows}</tbody></table></div></section>
    <section class="card" aria-labelledby="fcH"><h3 id="fcH">Flashcards from this lab</h3>
      <p class="muted small">${CARDS.length} atomic cards. Review now, then again when due (about 1 → 3 → 7 → 14 → 30 days for each "Good"; "Again" brings a card back in 10 minutes). The schedule is saved in this browser${store.ok ? '' : ' (storage is blocked, so it won\'t persist)'}.</p>
      <p class="small muted">This is a default ladder, not a research-optimal schedule. If your exam is sooner, shorten the gaps so you get several reviews before it.</p>
      <div id="reviewBox">${reviewHTML()}</div>
      <div class="tbl-wrap" style="margin-top:16px"><table class="res"><thead><tr><th>Front</th><th>Back</th><th>Next due</th></tr></thead><tbody id="cardRows">${CARDS.map(c => `<tr><td>${esc(c.q)}</td><td>${esc(c.a)}</td><td class="small">${fmtDue(c)}</td></tr>`).join('')}</tbody></table></div>
      <div class="btn-row"><button class="btn secondary" type="button" data-act="exp-quizlet">Export to Quizlet (.txt)</button><button class="btn secondary" type="button" data-act="exp-anki">Export to Anki (.txt)</button></div>
      <p class="small muted">Quizlet: Create → Import, choose "Tab" between term and definition and "New line" between cards. Anki: File → Import; the header sets the tab separator.</p></section>
    <details class="notes"><summary>Sources &amp; model notes</summary><div class="notes-in">${SOURCES_HTML}</div></details>
    <div class="btn-row"><button class="btn ghost" type="button" data-act="clear">Start over (clear progress)</button></div>
  </div>${navBar()}`;
};

/* =====================================================================
   RENDER + EVENTS
   ===================================================================== */
function render() {
  renderNotices(); renderRail();
  const id = STEPS[S.step].id; $('main').innerHTML = R[id]();
  if (id === 'results') { /* no-op: content already built */ }
}
function rerenderKeepScroll() { const y = window.scrollY; const ae = document.activeElement; const aid = ae && ae.id; const aname = ae && ae.name; const aval = ae && ae.value; render(); window.scrollTo(0, y);
  let f = aid && $(aid); if (!f && aname) f = document.querySelector(`[name="${CSS.escape(aname)}"][value="${CSS.escape(aval)}"]`); if (f && !f.disabled) f.focus({ preventScroll: true }); }

function parseNum(s) { const v = parseFloat(String(s).replace(',', '.').replace(/[^\d.\-]/g, '')); return isFinite(v) ? v : null; }
function download(name, text) {
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' }); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}
const clean = s => String(s).replace(/[\t\r\n]+/g, ' ').trim();

const main = $('main');
main.addEventListener('click', e => {
  const b = e.target.closest('[data-act],[data-term],[data-hint]'); if (!b) return;
  if (b.dataset.term) { const id = b.dataset.term; if (!S.parts.seen.includes(id)) S.parts.seen.push(id); save(); rerenderKeepScroll(); const t = document.querySelector(`[data-term="${id}"]`); if (t) t.focus(); return; }

    if (k === 'explore') { S.explore.hint++; ['q1', 'q2'].forEach(q => { if (!resolved(q)) item(q, CHECKPOINT[q]).hint = S.explore.hint; }); }
    else { S.worked.hint[k]++; item(k, WORKED[k]).hint = S.worked.hint[k]; }
    save(); rerenderKeepScroll(); announce('Hint shown.'); return; }
  const act = b.dataset.act;
  if (b.getAttribute('aria-disabled') === 'true' && act !== 'next') { announce('Not available yet.'); return; }
  switch (act) {
    case 'next': return next();

    case 'clear': return openClear();
    case 'hook-save': { const t = $('hookText').value.trim(); if (!t) { $('hookText').focus(); announce('Write a guess, or choose I don\'t have a guess yet.'); return; } S.hook = { text: t, done: true, skipped: false }; save(); rerenderKeepScroll(); return; }
    case 'hook-skip': S.hook = { text: $('hookText').value.trim(), done: true, skipped: true }; save(); return rerenderKeepScroll();
    case 'commit': { const p = S.predict; if (p.value == null || !p.conf) return; p.committed = true; save(); rerenderKeepScroll(); announce(`Committed. You predicted ${p.value} percent; the model gives ${pct(MODEL.hbo2(40, STANDARD))} percent.`); const g = $('gapText'); if (g) g.focus(); return; }
    case 'gap-save': { const t = $('gapText').value.trim(); if (!t) { $('gapText').focus(); announce('Write at least a few words about the gap.'); return; } S.predict.gap = t; S.predict.gapSaved = true; save(); return rerenderKeepScroll(); }
    case 'preset-sprint': { S.sim.pco2 = 60; S.sim.temp = 39; S.sim.m = 7.2 + Math.log10(60 / 40); S.sim.inst = 'sprint'; touch('preset'); save(); $('simCtrls').innerHTML = simControlsHTML(); updateSim(); announce('Sprinting muscle preset applied.'); return; }
    case 'sim-reset': { S.sim = defaultSim(); save(); $('simCtrls').innerHTML = simControlsHTML(); updateSim(); announce('Simulation reset to standard conditions.'); $('cPH').focus(); return; }
    case 'q1-check': { const v = parseNum($('q1in').value); S.explore.q1 = $('q1in').value; if (v == null) { announce('Enter a number.'); return; } const it = item('q1', CHECKPOINT.q1); it.attempts++; it.ts = Date.now(); it.correct = Math.abs(v - CHECKPOINT.q1.answer()) <= CHECKPOINT.q1.tol; save(); return rerenderKeepScroll(); }
    case 'q1-reveal': { const it = item('q1', CHECKPOINT.q1); it.revealed = true; it.ts = Date.now(); save(); return rerenderKeepScroll(); }
    case 'q2-check': { const c = document.querySelector('input[name="q2"]:checked'); if (!c) { announce('Choose an option.'); return; } S.explore.q2 = c.value; const it = item('q2', CHECKPOINT.q2); it.attempts++; it.ts = Date.now(); it.correct = c.value === CHECKPOINT.q2.correct; save(); return rerenderKeepScroll(); }
    case 'q2-reveal': { const it = item('q2', CHECKPOINT.q2); it.revealed = true; it.ts = Date.now(); save(); return rerenderKeepScroll(); }
    case 'ex-submit': { const c = document.querySelector('input[name="exChoice"]:checked'); const t = $('exText').value.trim(); if (!c || !t) { $('exMsg').textContent = !c ? 'Choose a principle first.' : 'Finish the "because…" sentence.'; announce($('exMsg').textContent); return; }
      Object.assign(S.explain, { choice: c.value, text: t, submitted: true }); const it = item('xc', { target: 'T3', label: 'Explain: choose the principle' }); it.attempts = 1; it.ts = Date.now(); it.correct = c.value === EXPLAIN.correct; save(); return rerenderKeepScroll(); }
    case 'ex-save': S.explain.rubric = [...document.querySelectorAll('input[name="exRub"]:checked')].map(i => +i.value); S.explain.saved = true; save(); return rerenderKeepScroll();
    case 'w1-done': { const t = $('se1').value.trim(); if (!t) { $('w1Msg').textContent = 'Write one sentence first; then compare.'; $('se1').focus(); announce($('w1Msg').textContent); return; } S.worked.se1 = t; S.worked.w1done = true; save(); return rerenderKeepScroll(); }
    case 'num-check': { const k = b.dataset.key; const inp = $(k + 'in'); S.worked[k] = inp.value; const v = parseNum(inp.value); if (v == null) { announce('Enter a number.'); return; } const it = item(k, WORKED[k]); it.attempts++; it.ts = Date.now(); it.lastVal = v; it.correct = Math.abs(v - WORKED[k].answer()) <= WORKED[k].tol; save(); rerenderKeepScroll(); announce(it.correct ? 'Correct.' : 'Not yet.'); return; }
    case 'num-reveal': { const k = b.dataset.key; const it = item(k, WORKED[k]); it.revealed = true; it.ts = Date.now(); save(); return rerenderKeepScroll(); }
    case 'mc-submit': { const qid = b.dataset.q; const q = qid === 'tr' ? TRANSFER : MCQ.find(m => m.id === qid); const st = S.mcq[qid]; if (!st || !st.ans || !st.reason || !st.conf) return;
      st.submitted = true; const it = item(qid, q); it.attempts = 1; it.ts = Date.now(); it.conf = st.conf; it.correct = st.ans === q.correct && st.reason === q.reasonCorrect; save(); rerenderKeepScroll(); const card = $('mc-' + qid); if (card) { const fb = card.querySelector('.fb'); if (fb) announce(fb.textContent.trim().slice(0, 220)); } return; }
    case 'tr-model': { const t = $('trText').value.trim(); if (!t) { $('trMsg').textContent = 'Write your explanation first.'; $('trText').focus(); announce($('trMsg').textContent); return; } S.transfer.text = t; S.transfer.revealModel = true; save(); return rerenderKeepScroll(); }
    case 'tr-save': S.transfer.rubric = [...document.querySelectorAll('input[name="trRub"]:checked')].map(i => +i.value); S.transfer.saved = true; save(); return rerenderKeepScroll();
    case 'exit-submit': {
      const A = S.exit.answers; let missing = 0;
      EXIT.forEach(q => { if (q.type === 'num') { A[q.id] = $('ex-' + q.id).value; if (!String(A[q.id]).trim()) missing++; } else if (q.type === 'multi') { A[q.id] = [...document.querySelectorAll(`input[name="ex-${q.id}"]:checked`)].map(i => i.value); if (!A[q.id].length) missing++; } else { const c = document.querySelector(`input[name="ex-${q.id}"]:checked`); A[q.id] = c ? c.value : null; if (!c) missing++; } });
      if (missing) { $('exitMsg').textContent = `Answer all ${EXIT.length} (${missing} left). A guess is fine.`; announce($('exitMsg').textContent); save(); return; }
      EXIT.forEach(q => { const it = item(q.id, q); it.attempts = 1; it.ts = Date.now(); it.hint = S.exit.peeked ? 1 : 0;
        if (q.type === 'num') { const v = parseNum(A[q.id]); it.correct = v != null && q.check(v); }
        else if (q.type === 'multi') { const s = [...A[q.id]].sort().join(); it.correct = s === [...q.correct].sort().join(); }
        else it.correct = A[q.id] === q.correct; });

    case 'rv-start': review = { queue: dueCards(), i: 0, showing: false }; $('reviewBox').innerHTML = reviewHTML(); focusIn('#reviewBox'); return;
    case 'rv-show': review.showing = true; $('reviewBox').innerHTML = reviewHTML(); focusIn('#reviewBox', '[data-act="rv-good"]'); return;
    case 'rv-again': case 'rv-good': gradeCard(review.queue[review.i].id, act === 'rv-good'); review.i++; review.showing = false; $('reviewBox').innerHTML = reviewHTML(); $('cardRows').innerHTML = CARDS.map(c => `<tr><td>${esc(c.q)}</td><td>${esc(c.a)}</td><td class="small">${fmtDue(c)}</td></tr>`).join(''); focusIn('#reviewBox'); return;
    case 'rv-reset': review = { queue: null, i: 0, showing: false }; $('reviewBox').innerHTML = reviewHTML(); focusIn('#reviewBox'); return;
    case 'exp-quizlet': return download('oxygen-hemoglobin-quizlet.txt', CARDS.map(c => `${clean(c.q)}\t${clean(c.a)}`).join('\n') + '\n');
    case 'exp-anki': return download('oxygen-hemoglobin-anki.txt', '#separator:tab\n#html:false\n' + CARDS.map(c => `${clean(c.q)}\t${clean(c.a)}`).join('\n') + '\n');
  }
});
function focusIn(sel, pref) { const box = document.querySelector(sel); if (!box) return; const f = (pref && box.querySelector(pref)) || box.querySelector('button:not([aria-disabled="true"])'); if (f) f.focus(); }
function touch(k) { if (!S.touched.includes(k)) S.touched.push(k); }

main.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'predRange') { S.predict.value = +t.value; save(); partialPredict(); return; }
  if (['cPH', 'cCO2', 'cT', 'cProbe'].includes(t.id)) {
    const v = +t.value;
    if (t.id === 'cPH') { S.sim.m = v + Math.log10(S.sim.pco2 / 40); }
    if (t.id === 'cCO2') { S.sim.pco2 = v; $('cCO2Val').textContent = v + ' mmHg'; t.setAttribute('aria-valuetext', v + ' mmHg'); }
    if (t.id === 'cT') { S.sim.temp = v; $('cTVal').textContent = v.toFixed(1) + ' °C'; t.setAttribute('aria-valuetext', v.toFixed(1) + ' degrees Celsius'); }
    if (t.id === 'cProbe') { S.sim.probe = v; $('cProbeVal').textContent = v + ' mmHg'; t.setAttribute('aria-valuetext', v + ' millimeters of mercury'); if (S.sim.inst !== 'probe') { S.sim.inst = 'probe'; } }
    touch(t.id); updateSim(t.id); return;
  }
  if (t.id === 'hookText') { S.hook.text = t.value; save(); }
  if (t.id === 'gapText') { S.predict.gap = t.value; save(); }
  if (t.id === 'exText') { S.explain.text = t.value; save(); }
  if (t.id === 'se1') { S.worked.se1 = t.value; save(); }
  if (t.id === 'trText') { S.transfer.text = t.value; save(); }
  if (t.id === 'q1in') { S.explore.q1 = t.value; save(); }
  if (t.id === 'w2in' || t.id === 'w3in') { S.worked[t.id.slice(0, 2)] = t.value; save(); }
  if (t.id && t.id.startsWith('ex-e')) { S.exit.started = true; S.exit.answers[t.id.slice(3)] = t.value; save(); }
});
main.addEventListener('change', e => {
  const t = e.target; const n = t.name || '';
  if (n === 'predConf') { S.predict.conf = t.value; save(); partialPredict(); return; }
  if (n === 'bpg') { S.sim.bpg = t.value; touch('bpg'); updateSim(); return; }
  if (t.id === 'cFetal') { S.sim.fetal = t.checked; touch('fetal'); save(); $('simCtrls').innerHTML = simControlsHTML(); $('cFetal').focus(); updateSim(); return; }
  if (t.id === 'cCO') { S.sim.co = t.checked; touch('co'); updateSim(); return; }
  if (n === 'inst') { S.sim.inst = t.value; updateSim(); const f = document.querySelector(`input[name="inst"][value="${t.value}"]`); if (f) f.focus(); return; }
  if (n === 'q2') { S.explore.q2 = t.value; save(); return; }
  if (n === 'exChoice') { S.explain.choice = t.value; save(); return; }
  if (n.startsWith('ans-') || n.startsWith('rsn-') || n.startsWith('conf-')) {
    const [kind, qid] = n.split('-'); const st = S.mcq[qid] = S.mcq[qid] || {};
    if (kind === 'ans') st.ans = t.value; else if (kind === 'rsn') st.reason = t.value; else st.conf = t.value;
    save(); rerenderKeepScroll(); return;
  }
  if (n.startsWith('ex-e')) { S.exit.started = true; const q = EXIT.find(x => x.id === n.slice(3)); S.exit.answers[q.id] = q.type === 'multi' ? [...document.querySelectorAll(`input[name="${n}"]:checked`)].map(i => i.value) : t.value; save(); }
});
function partialPredict() {
  const fig = $('predChart'); if (fig) fig.outerHTML = predictSVG();
  const p = S.predict; const v = $('predVal'); if (v) v.textContent = p.value == null ? '—' : p.value + '%';
  const r = $('predRange'); if (r) r.setAttribute('aria-valuetext', p.value == null ? 'not placed' : p.value + ' percent');
  const btn = document.querySelector('[data-act="commit"]'); if (btn) { if (p.value != null && p.conf) btn.removeAttribute('aria-disabled'); else btn.setAttribute('aria-disabled', 'true'); }
  const m = $('commitMsg'); if (m) m.textContent = p.value == null ? 'Place a point, then pick a confidence.' : !p.conf ? 'Now pick a confidence.' : 'Ready. Committing locks your answer.';
}
/* Pointer drag on the prediction chart */
let dragging = false;
function predFromEvent(e) {
  const svg = $('predChart'); if (!svg || S.predict.committed) return;
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const loc = pt.matrixTransform(svg.getScreenCTM().inverse());
  const s = 1 - (loc.y - CH.mt) / (CH.h - CH.mt - CH.mb); S.predict.value = Math.max(0, Math.min(100, Math.round(s * 100)));
  const r = $('predRange'); if (r) r.value = S.predict.value; save(); partialPredict();
}
main.addEventListener('pointerdown', e => { if (e.target.closest('#predChart') && !S.predict.committed) { dragging = true; predFromEvent(e); e.preventDefault(); } });
window.addEventListener('pointermove', e => { if (dragging) predFromEvent(e); });
window.addEventListener('pointerup', () => { dragging = false; });

/* Clear progress (in-page dialog) */
function openClear() { const d = $('confirmDlg'); if (d.showModal) d.showModal(); else d.setAttribute('open', ''); $('dlgNo').focus(); }
$('clearBtn').addEventListener('click', openClear);
$('dlgNo').addEventListener('click', () => $('confirmDlg').close());
$('dlgYes').addEventListener('click', () => {
  store.del(STORAGE_KEY); store.del(CARDS_KEY); S = freshState(); CARDSTATE = { v: 1, cards: {} }; review = { queue: null, i: 0, showing: false }; resumeDismissed = true;
  $('confirmDlg').close(); save(); render(); announce('Progress cleared. Back at step 1.'); const h = document.querySelector('#main h2'); if (h) { h.setAttribute('tabindex', '-1'); h.focus(); } window.scrollTo(0, 0);
});

render();
